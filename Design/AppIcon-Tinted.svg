<!-- iOS 18 tinted appearance variant of AppIcon.svg: grayscale, the system applies the tint.
     Luminance carries the design - bright BB and arc, dim rings, black ground. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="trt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.75"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#000000"/>
  <circle cx="512" cy="512" r="322" fill="none" stroke="#2E2E2E" stroke-width="52"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="#404040" stroke-width="26"/>
  <path d="M 512 190 A 322 322 0 0 1 834 512" fill="none" stroke="#B4B4B4" stroke-width="52" stroke-linecap="round"/>
  <rect x="300" y="490" width="230" height="44" rx="22" fill="url(#trt)"/>
  <circle cx="560" cy="512" r="92" fill="#FFFFFF"/>
  <circle cx="532" cy="482" r="28" fill="#FFFFFF"/>
</svg>
