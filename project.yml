# XcodeGen 定義。`xcodegen generate` で Muzzlemeter.xcodeproj を作る。
# .xcodeproj は生成物なので .gitignore してある（README 参照）。
name: Muzzlemeter

options:
  bundleIdPrefix: com.yhakamay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  # UI 文言は日本語で書き、English は翻訳として持つ（詳細は該当コミットの ADR）。
  # developmentLanguage は CFBundleDevelopmentRegion に、knownRegions は
  # プロジェクトの既知リージョン（= 各 .lproj の生成対象）になる。
  developmentLanguage: ja
  knownRegions: [ja, en, Base]

packages:
  # ルートの Package.swift（MuzzlemeterKit）をローカルパッケージとして参照する。
  MuzzlemeterKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    # String Catalog へ文言を抽出するために必要（未設定だと .xcstrings が同期されない）。
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Muzzlemeter:
    type: application
    platform: iOS
    sources:
      - path: App/Muzzlemeter
    dependencies:
      - package: MuzzlemeterKit
        product: MuzzlemeterKit
    settings:
      base:
        PRODUCT_NAME: Muzzlemeter
        PRODUCT_BUNDLE_IDENTIFIER: com.yhakamay.muzzlemeter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZHMSV7C5P
        # WeatherKit を使うためのエンタイトルメント（App ID 側でも有効化済み）。
        CODE_SIGN_ENTITLEMENTS: App/Muzzlemeter.entitlements
        # Info.plist はビルド設定から合成する。`App/Info.plist` は「ビルド設定では
        # 配列を書けないキー」だけを持つ土台で、GENERATE_INFOPLIST_FILE と
        # INFOPLIST_KEY_* の内容がここへマージされる。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Muzzlemeter
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "弾速計 AC6000 と接続して計測値を受け取るために Bluetooth を使用します。"
        # 用途説明はビルド設定に日本語（開発言語）を置き、各言語の文言は
        # Resources/<lang>.lproj/InfoPlist.strings が実行時に差し替える。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "計測した場所の気温・湿度・気圧を記録するために、セッションの開始時に一度だけ現在地を使用します。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

schemes:
  Muzzlemeter:
    build:
      targets:
        Muzzlemeter: all
    run:
      config: Debug
      # シミュレータでは自動的にリプレイモードになるが、実機で UI を確認したいときのために
      # 起動引数でも切り替えられるようにしてある（既定は無効）。
      commandLineArguments:
        "--replay": false
    profile:
      config: Release
    archive:
      config: Release
