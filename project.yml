# XcodeGen 定義。`xcodegen generate` で AceChrono.xcodeproj を作る。
# .xcodeproj は生成物なので .gitignore してある（README 参照）。
name: AceChrono

options:
  bundleIdPrefix: com.yhakamay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

packages:
  # ルートの Package.swift（AceChronoKit）をローカルパッケージとして参照する。
  AceChronoKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AceChrono:
    type: application
    platform: iOS
    sources:
      - path: App/AceChrono
    dependencies:
      - package: AceChronoKit
        product: AceChronoKit
    settings:
      base:
        PRODUCT_NAME: AceChrono
        PRODUCT_BUNDLE_IDENTIFIER: com.yhakamay.acechrono
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Info.plist はビルド設定から生成する（別ファイルを持たない）。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AceChrono
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "弾速計 AC6000 と接続して計測値を受け取るために Bluetooth を使用します。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

schemes:
  AceChrono:
    build:
      targets:
        AceChrono: all
    run:
      config: Debug
      # シミュレータでは自動的にリプレイモードになるが、実機で UI を確認したいときのために
      # 起動引数でも切り替えられるようにしてある（既定は無効）。
      commandLineArguments:
        "--replay": false
    profile:
      config: Release
    archive:
      config: Release
