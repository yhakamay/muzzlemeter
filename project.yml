# XcodeGen 定義。`xcodegen generate` で Muzzlemeter.xcodeproj を作る。
# .xcodeproj は生成物なので .gitignore してある（README 参照）。
name: Muzzlemeter

options:
  bundleIdPrefix: com.yhakamay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top
  # Source string literals stay Japanese (they are the String Catalog keys), but the
  # app's *fallback* language is English: developmentLanguage becomes
  # CFBundleDevelopmentRegion, which is what iOS falls back to when none of the
  # user's preferred languages is shipped.
  # knownRegions is the project's known region list (= the .lproj folders that get built).
  developmentLanguage: en
  knownRegions: [en, ja, zh-Hant, Base]

packages:
  # ルートの Package.swift（MuzzlemeterKit）をローカルパッケージとして参照する。
  MuzzlemeterKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    # String Catalog へ文言を抽出するために必要（未設定だと .xcstrings が同期されない）。
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Muzzlemeter:
    type: application
    platform: iOS
    sources:
      - path: App/Muzzlemeter
      - path: App/Shared
    dependencies:
      - package: MuzzlemeterKit
        product: MuzzlemeterKit
      # ホーム画面ウィジェット / ライブアクティビティ拡張。アプリの中に埋め込む。
      - target: MuzzlemeterWidgets
        embed: true
      # Apple Watch のコンパニオンアプリ。Xcode の「Embed Watch Content」相当。
      - target: MuzzlemeterWatch
        embed: true
    settings:
      base:
        PRODUCT_NAME: Muzzlemeter
        PRODUCT_BUNDLE_IDENTIFIER: com.yhakamay.muzzlemeter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZHMSV7C5P
        # WeatherKit・App Group を使うためのエンタイトルメント（App ID 側でも有効化済み）。
        CODE_SIGN_ENTITLEMENTS: App/Muzzlemeter.entitlements
        # Info.plist はビルド設定から合成する。`App/Info.plist` は「ビルド設定では
        # 配列を書けないキー」だけを持つ土台で、GENERATE_INFOPLIST_FILE と
        # INFOPLIST_KEY_* の内容がここへマージされる。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Muzzlemeter
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Used to connect to the AC6000 chronograph and receive its measurements."
        # The usage descriptions carry the development language (English) in the build
        # settings; Resources/<lang>.lproj/InfoPlist.strings substitutes the wording of
        # each shipped language at runtime.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used once when a session starts, to record the temperature, humidity and pressure where you are shooting."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ロック画面 / Dynamic Island のライブアクティビティを許可する（Round E）。
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # The app ships no encryption of its own (only HTTPS/WeatherKit and the
        # standard OS crypto, which are exempt). Declaring this here answers the
        # export-compliance question once, instead of per TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App icon lives in App/Muzzlemeter/Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MuzzlemeterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/MuzzlemeterWidgets
      - path: App/Shared
    dependencies:
      - package: MuzzlemeterKit
        product: MuzzlemeterKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: MuzzlemeterWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.yhakamay.muzzlemeter.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZHMSV7C5P
        # ホーム画面ウィジェットが App Group 越しに HomeWidgetSnapshot を読むために必要。
        CODE_SIGN_ENTITLEMENTS: App/MuzzlemeterWidgets/MuzzlemeterWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/MuzzlemeterWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Muzzlemeter
        SKIP_INSTALL: YES

  MuzzlemeterWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/MuzzlemeterWatch
    dependencies:
      - package: MuzzlemeterKit
        product: MuzzlemeterKit
    settings:
      base:
        PRODUCT_NAME: MuzzlemeterWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.yhakamay.muzzlemeter.watchapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZHMSV7C5P
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/MuzzlemeterWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Muzzlemeter
        # iPhone 本体アプリのコンパニオンとして動く（単独インストール不可）。
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yhakamay.muzzlemeter
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # watchOS needs its own icon set; it does not inherit the iPhone app's.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

schemes:
  Muzzlemeter:
    build:
      targets:
        Muzzlemeter: all
        MuzzlemeterWidgets: all
        MuzzlemeterWatch: all
    run:
      config: Debug
      # シミュレータでは自動的にリプレイモードになるが、実機で UI を確認したいときのために
      # 起動引数でも切り替えられるようにしてある（既定は無効）。
      commandLineArguments:
        "--replay": false
    profile:
      config: Release
    archive:
      config: Release
  # Watch 単体のビルド確認用（ペアリングしたシミュレータが無い環境でも
  # `generic/platform=watchOS Simulator` へビルドできることを確かめるため）。
  MuzzlemeterWatch:
    build:
      targets:
        MuzzlemeterWatch: all
    run:
      config: Debug
