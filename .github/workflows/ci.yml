name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチ / PR で走っている古いジョブは打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    # Xcode 26 が要る。Xcode 16.4 では @Observable マクロの展開が
    # `!=` を要求し、SwiftData の @Model 型（GunProfile）が Equatable でないため
    # アプリのビルドが落ちる（Observation の実装が Xcode 26 で変わっている）。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # MuzzlemeterKit と muzzlemeter-sniff は SwiftPM だけでビルド・テストできる。
      - name: swift test
        run: swift test

      # .xcodeproj は生成物なのでリポジトリに無い。XcodeGen で作ってからビルドする。
      # 署名は CI では不要（CODE_SIGNING_ALLOWED=NO）。
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: xcodegen generate
        run: xcodegen generate

      # Round E: Muzzlemeter は MuzzlemeterWidgets（ウィジェット拡張）と
      # MuzzlemeterWatch（watchOS コンパニオンアプリ）を埋め込むようになった。
      # スキームの検証時に対応プラットフォームの Simulator ランタイムが
      # 入っていないと「watchOS x.y must be installed」でビルドが落ちる。
      # ランナーに無いことがあるため、明示的に取得しておく（既にあれば数秒で終わる）。
      - name: Ensure watchOS simulator runtime
        run: xcodebuild -downloadPlatform watchOS

      # -scheme Muzzlemeter は「build: Muzzlemeter / MuzzlemeterWidgets /
      # MuzzlemeterWatch を all」で構成してある（project.yml）ので、
      # このコマンド 1 つでアプリ本体・ウィジェット拡張・Watch アプリの
      # 3 ターゲットすべてがビルドされる。署名は CI では不要
      # （CODE_SIGNING_ALLOWED=NO）。
      - name: Build iOS app + widgets + watch app
        run: |
          xcodebuild -project Muzzlemeter.xcodeproj -scheme Muzzlemeter \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
