name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    # Xcode 27 (image label `xcode-27`, currently a preview image) matches the
    # toolchain the app is developed against. Older toolchains have broken this
    # project twice in ways that only show up at compile time: Xcode 16.4's
    # @Observable expansion required Equatable on a SwiftData @Model, and
    # Xcode 27 dropped a conformance that Xcode 26 had supplied. Building on the
    # same major version the developer uses is what keeps CI honest.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # MuzzlemeterKit and muzzlemeter-sniff build and test with SwiftPM alone.
      - name: swift test
        run: swift test

      # The .xcodeproj is generated, so it is not in the repository.
      # Signing is not needed in CI (CODE_SIGNING_ALLOWED=NO).
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: xcodegen generate
        run: xcodegen generate

      # Muzzlemeter embeds MuzzlemeterWidgets (widget extension) and
      # MuzzlemeterWatch (watchOS companion app). Scheme validation fails with
      # "watchOS x.y must be installed" when the runner lacks that simulator
      # runtime, so fetch it explicitly (a no-op of a few seconds if present).
      - name: Ensure watchOS simulator runtime
        run: xcodebuild -downloadPlatform watchOS

      # The Muzzlemeter scheme builds all three targets (app, widget extension,
      # watch app) — see project.yml — so this single command covers them.
      - name: Build iOS app + widgets + watch app
        run: |
          xcodebuild -project Muzzlemeter.xcodeproj -scheme Muzzlemeter \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
